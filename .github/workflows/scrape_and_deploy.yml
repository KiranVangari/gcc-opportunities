name: Daily GCC Job Scraper

on:
  schedule:
    - cron: '0 8 */3 * *' # Runs every 3 days at 08:00 UTC
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }} 
        run: |
          mkdir -p public
          python job_scraper.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          commit_message: "Automated update of job dashboard"

      - name: Wait for GitHub Pages Build
        run: sleep 180 # Pauses the server for 2 minutes to let the site go live

      - name: Send Notification Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Turbomachinery & Reliability Job opportunities"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitHub Actions Scraper
          body: |
            Your automated GCC Turbomachinery & Reliability job scraper has successfully finished running.
            
            You can view the latest updated job dashboard here:
            https://kiranvangari.github.io/gcc-opportunities/
            
            This is an automated notification sent from your GitHub Actions workflow.
